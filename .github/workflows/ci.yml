name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend schema, tests and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/locadora_ci
        run: npx prisma validate
      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/locadora_ci
        run: npx prisma generate
      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=moderate
      - name: Run tests
        working-directory: backend
        run: npm test

  mysql-integration:
    name: MySQL API integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: locadora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci_password@127.0.0.1:3306/locadora_ci
      JWT_SECRET: ci-integration-test-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Run real MySQL API integration
        working-directory: backend
        env:
          RUN_MYSQL_INTEGRATION: 'true'
        run: node --test test/api.mysql.integration.test.js

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
